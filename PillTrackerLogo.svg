<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
    width="108"
    height="108"
    viewBox="0 0 108 108">

  <!-- White background -->
  <rect width="108" height="108" fill="white"/>

  <!--
    Minimal elephant — smooth curved lines only.
    Blue (#5B8DEF) → Purple (#A855F7) gradient.
    No overlapping strokes, no harsh edges.
  -->

  <!-- Elephant body: smooth rounded arc -->
  <path
      fill="none"
      stroke="#5B8DEF"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M28,68
        C28,56 38,47 54,47
        C70,47 80,56 80,68
        C80,77 72,82 62,82
        C50,82 40,78 32,72"/>

  <!-- Head: smooth oval -->
  <path
      fill="none"
      stroke="#7B6EF7"
      stroke-width="5"
      stroke-linecap="round"
      d="M46,47
        C46,35 54,29 62,29
        C70,29 76,35 76,45
        C76,53 70,57 62,57
        C54,57 46,53 46,47"/>

  <!-- Ear: soft curve -->
  <path
      fill="none"
      stroke="#A855F7"
      stroke-width="4.5"
      stroke-linecap="round"
      d="M70,37
        C76,32 82,36 83,43
        C84,50 80,54 74,53"/>

  <!-- Trunk: single flowing S-curve -->
  <path
      fill="none"
      stroke="#5B8DEF"
      stroke-width="4.5"
      stroke-linecap="round"
      d="M46,52
        C43,55 40,59 40,64
        C40,69 43,73 48,74
        C52,75 55,72 56,68"/>

  <!-- Tail: gentle curve -->
  <path
      fill="none"
      stroke="#A855F7"
      stroke-width="3.5"
      stroke-linecap="round"
      d="M80,65
        C85,62 89,64 90,68
        C91,72 88,75 84,74"/>

</svg>
